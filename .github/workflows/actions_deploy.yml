name: TFG CI/CD

on:
  push:
    branches:
      - main

jobs:

  test:
    name: Ejecutar tests Django
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Instalar librerías del sistema para python-ldap
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev build-essential

      - name: Dependencias y testeo
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py test

    name: Reconstruir imagenes
    needs: test 
    runs-on: ubuntu-latest
    environment: Secrets
    steps:
      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Construir y subir Backend
        uses: docker/build-push-action@v5
        with:
            context: ./backend
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/tfg-backend:latest

     - name: Construir y subir Frontend
       uses: docker/build-push-action@v5
       with:
           context: ./frontend
           push: true
           tags: ${{ secrets.DOCKER_USERNAME }}/tfg-frontend:latest
           build-args: |
               VITE_API_URL=https://logface.work.gd

  deploy:
    name: Despliegue cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Conetar al EKS
        run: aws eks update-kubeconfig --region us-east-1 --name tfg-cluster

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2
      
      - name: Aplicar Terraform
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Instalar Cert-Manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.4/cert-manager.yaml
          sleep 30

      - name: Desplegar la Aplicación
        run: |
          kubectl apply -f cluster/

      - name: Reiniciar Pods
        run: |
          kubectl rollout restart deployment backend
          kubectl rollout restart deployment frontend

      - name: Obtener URL 
        run: |
          for i in {1..48}; do
            URL=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$URL" ]; then
              echo "$URL"
              exit 0
            fi
            echo "Pending"
            sleep 5
          done
          echo "Tiempo agotado"
