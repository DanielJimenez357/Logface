name: tfg
services:
  backend:
    build:
      context: /home/daniel/Desktop/proyects/tfg/backend
      dockerfile: Dockerfile
    container_name: tfg_django
    depends_on:
      db:
        condition: service_healthy
        required: true
      openldap:
        condition: service_started
        required: true
    environment:
      DATABASE_URL: postgres://usuario_tfg:123@db:5432/tfg_db
      DJANGO_SUPERUSER_EMAIL: admin@gmail.com
      DJANGO_SUPERUSER_PASSWORD: "123"
      DJANGO_SUPERUSER_USERNAME: admin
      LDAP_BIND_DN: cn=admin,dc=logfacedomain,dc=com
      LDAP_BIND_PASSWORD: "123"
      LDAP_SEARCH_BASE: dc=logfacedomain,dc=com
      LDAP_URI: ldap://openldap:389
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8000
        published: "8000"
        protocol: tcp
  db:
    container_name: tfg_postgres
    environment:
      POSTGRES_DB: tfg_db
      POSTGRES_PASSWORD: "123"
      POSTGRES_USER: usuario_tfg
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U usuario_tfg -d tfg_db
      timeout: 5s
      interval: 5s
      retries: 5
    image: postgres:15-alpine
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5432
        published: "5433"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
  frontend:
    build:
      context: /home/daniel/Desktop/proyects/tfg/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: tfg_react
    depends_on:
      backend:
        condition: service_started
        required: true
    networks:
      default: null
    ports:
      - mode: ingress
        target: 80
        published: "3000"
        protocol: tcp
  openldap:
    container_name: tfg_ldap
    environment:
      LDAP_ADMIN_PASSWORD: "123"
      LDAP_DOMAIN: logfacedomain.com
      LDAP_ORGANISATION: logface
    image: osixia/openldap:1.5.0
    networks:
      default: null
    ports:
      - mode: ingress
        target: 389
        published: "389"
        protocol: tcp
      - mode: ingress
        target: 636
        published: "636"
        protocol: tcp
    volumes:
      - type: bind
        source: /home/daniel/Desktop/proyects/tfg/openldap_data
        target: /var/lib/ldap
        bind:
          create_host_path: true
      - type: bind
        source: /home/daniel/Desktop/proyects/tfg/openldap_config
        target: /etc/ldap/slapd.d
        bind:
          create_host_path: true
networks:
  default:
    name: tfg_default
volumes:
  postgres_data:
    name: tfg_postgres_data
